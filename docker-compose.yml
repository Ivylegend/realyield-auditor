services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: realyield
      POSTGRES_PASSWORD: realyield
      POSTGRES_DB: realyield
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realyield"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./data/uploads:/data/uploads"]
  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: celery -A app.worker.celery worker --loglevel=INFO
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_API_URL: http://api:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
